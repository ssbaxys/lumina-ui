pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.9.0'
}

rootProject.name = 'lumina-ui'

// Ядро: чистая Java, без Minecraft. Вся логика UI живёт здесь.
include 'core'
// Тонкие модули загрузчиков: только рендер-бэкенд, ввод и точка входа мода.
include 'forge-1.20.1'
include 'neoforge-1.21.1'
// Тестовый мод (витрина): общий код; загрузочная часть живёт в source set `testmod` модулей выше.
include 'testmod-common'
