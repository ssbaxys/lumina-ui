plugins {
    // Обе версии плагина из одного артефакта ModDevGradle: legacyforge — для Forge 1.20.1.
    id 'net.neoforged.moddev' version '2.0.148' apply false
    id 'net.neoforged.moddev.legacyforge' version '2.0.148' apply false
}

// Общая конфигурация для всех модулей.
subprojects {
    apply plugin: 'java'

    group = mod_group
    version = mod_version

    base {
        archivesName = "${mod_id}-${project.name}"
    }

    repositories {
        mavenCentral()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs << '-Xlint:unchecked,deprecation,rawtypes'
    }

    tasks.withType(Jar).configureEach {
        manifest {
            attributes(
                'Specification-Title': mod_name,
                'Specification-Vendor': mod_authors,
                'Implementation-Title': project.name,
                'Implementation-Version': project.version,
                'Implementation-Vendor': mod_authors
            )
        }
    }
}
