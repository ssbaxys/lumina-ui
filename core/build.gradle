// Ядро не зависит от Minecraft: собирается и тестируется за секунды, без запуска игры.
// Целевая версия Java 17, чтобы тот же код компилировался и под 1.20.1, и под 1.21.1.
java {
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

dependencies {
    testImplementation platform("org.junit:junit-bom:${junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}
